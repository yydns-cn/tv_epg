name: EPG Auto Update

on:
  push: # 允许手动或推送时触发
  schedule:
    - cron: '0 */2 * * *' # 每2小时自动运行一次
  workflow_dispatch: # 允许在Actions页面手动点击运行

jobs:
  update-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 声明需要写入权限，与仓库设置双重保障

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Compress EPG
        run: |
          # 1. 删除可能存在的旧文件
          rm -f pp.xml pp.xml.gz
          
          # 2. 抓取最新的 pp.xml 文件
          wget https://epg.112114.xyz/pp.xml -O pp.xml[reference:5]
          
          # 3. 将文件压缩为 pp.xml.gz，并保留原文件
          gzip -k pp.xml
          
          # 4. 配置Git并提交两个文件
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add pp.xml pp.xml.gz
          git commit -m "Auto-update EPG files (pp.xml & pp.xml.gz)" || exit 0
          git push
